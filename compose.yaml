services:
  mongodb:
    image: 'mongo:latest'
    environment:
      - 'MONGO_INITDB_DATABASE=music_streaming'
      - 'MONGO_INITDB_ROOT_PASSWORD=secret'
      - 'MONGO_INITDB_ROOT_USERNAME=root'
    ports:
      - '27018:27017'
  mysql:
    image: 'mysql:latest'
    environment:
      - 'MYSQL_DATABASE=moodify'
      - 'MYSQL_ROOT_PASSWORD=${DATABASE_PASSWORD:-verysecret}'
    ports:
      - '3307:3306'

  detect-emotions:
    image: 'dreayrt/detect-emotions:latest'
    container_name: 'moodify-detect-emotions'
    restart: 'unless-stopped'
    ports:
      - '8000:8000'
    stdin_open: true
    tty: true
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'

  ocr-service:
    build:
      context: ../ocr-service
      dockerfile: Dockerfile
    image: 'moodify-ocr-service:local'
    container_name: 'moodify-ocr-service'
    restart: 'unless-stopped'
    ports:
      - '8001:8000'
    stdin_open: true
    tty: true
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'

  audio-analysis-service:
    profiles:
      - audio
    build:
      context: ../Moodify-Audio-Service
    image: 'moodify-audio-analysis:local'
    container_name: 'moodify-audio-analysis'
    restart: 'unless-stopped'
    ports:
      - '8002:8000'
    stdin_open: true
    tty: true
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'


