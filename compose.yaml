# Các container chính của Moodify.
# Chạy tại E:\moodify-backend: docker compose up -d --build
# Bật karaoke nhiều người (mediasoup): docker compose --profile karaoke up -d --build
# Bật thêm TURN relay: docker compose --profile karaoke --profile turn up -d --build
# Sao chép .env.example thành .env để đặt thông tin xác thực và ghi đè cấu hình.
# Scorer mặc định được build từ source local. Production có thể kéo image đã phát hành:
# KARAOKE_SCORING_IMAGE=dreayrt/audio_separator_for_karaoke:0.4.3-score
# KARAOKE_SCORING_PULL_POLICY=always

# Các phụ thuộc bên ngoài Compose:
# - Máy chủ nhạc/Nginx trên Google Cloud: AUDIO_SERVER_BASE_URL và NEXT_PUBLIC_AUDIO_SERVER_URL.
# - Google OAuth, Facebook OAuth và SePay: thông tin xác thực trong .env.
# - API Essentia phân tích âm thanh chưa có mã nguồn/image trong các repo hiện tại;
#   đặt AUDIO_ANALYSIS_SERVICE_BASE_URL tới API /analyze có thể truy cập (mặc định host.docker.internal:8002).
# - python-audio-separator dùng tách nhạc bằng GPU theo lô, không phải service chạy liên tục.
# - Chấm điểm karaoke production hiện chạy trong container riêng trên Google Cloud.
#   Compose local bên dưới chạy cùng image trong container karaoke-scoring.

services:
  frontend:
    build:
      context: ../Moodify/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
        NEXT_PUBLIC_AUDIO_SERVER_URL: ${NEXT_PUBLIC_AUDIO_SERVER_URL:-https://moodify.click}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-711124485487-2qb1s0uqa7e1uja1qio1kjggqgqdka7i.apps.googleusercontent.com}
        NEXT_PUBLIC_FACEBOOK_APP_ID: ${NEXT_PUBLIC_FACEBOOK_APP_ID:-2981895912150587}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_PORT: "8080"
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      APP_BACKEND_BASE_URL: ${APP_BACKEND_BASE_URL:-http://localhost:8080}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
      DATABASE_SOURCE_URL: "jdbc:mysql://mysql:3306/moodify?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true"
      DATABASE_USERNAME: ${DATABASE_USERNAME:-root}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-verysecret}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-music_streaming_1}
      MONGODB_URI: "mongodb://mongodb:27017/${MONGODB_DATABASE:-music_streaming_1}"
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-secret-before-deployment}
      AUDIO_SERVER_BASE_URL: ${AUDIO_SERVER_BASE_URL:-https://moodify.click/}
      SYNC_SCHEDULER_ENABLED: ${SYNC_SCHEDULER_ENABLED:-false}
      EMOTION_SERVICE_BASE_URL: http://detect-emotions:8000
      OCR_SERVICE_BASE_URL: http://ocr-service:8000
      AUDIO_ANALYSIS_SERVICE_BASE_URL: ${AUDIO_ANALYSIS_SERVICE_BASE_URL:-http://host.docker.internal:8002}
      KARAOKE_SCORING_URL: http://karaoke-scoring:8000
      KARAOKE_SCORING_KEY: ${KARAOKE_SCORING_KEY:-local-karaoke-dev-key-change-before-deployment}
      KARAOKE_MEDIA_TICKET_SECRET: ${KARAOKE_MEDIA_TICKET_SECRET:-local-only-ticket-secret-change-before-deployment}
      KARAOKE_MEDIA_SERVICE_SECRET: ${KARAOKE_MEDIA_SERVICE_SECRET:-local-only-media-secret-change-before-deployment}
      KARAOKE_MEDIA_WS_URL: ${KARAOKE_MEDIA_WS_URL:-ws://localhost:3001/ws}
      KARAOKE_ROOM_RECONNECT_GRACE_MS: ${KARAOKE_ROOM_RECONNECT_GRACE_MS:-30000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      SEPAY_SECRET_KEY: ${SEPAY_SECRET_KEY:-}
      SEPAY_BANK_ACCOUNT: ${SEPAY_BANK_ACCOUNT:-}
      SEPAY_BANK_NAME: ${SEPAY_BANK_NAME:-MBBank}
      SEPAY_ACCOUNT_NAME: ${SEPAY_ACCOUNT_NAME:-}
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      karaoke-scoring:
        condition: service_started

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: moodify
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD:-verysecret}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-music_streaming_1}
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  detect-emotions:
    image: dreayrt/detect-emotions:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  ocr-service:
    build:
      context: ../ocr-service
      dockerfile: Dockerfile
    image: moodify-ocr-service:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      APP_NAME: "OCR Service"
      APP_ENV: production
      DEBUG: "false"
      HOST: 0.0.0.0
      PORT: "8000"
      MAX_UPLOAD_SIZE_MB: "10"
      OCR_LANGUAGE: vi
      PDF_RENDER_DPI: "200"
      MIN_TEXT_LENGTH_THRESHOLD: "20"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  # API chấm điểm dùng chung network Compose; backend gọi qua DNS karaoke-scoring:8000.
  karaoke-scoring:
    image: ${KARAOKE_SCORING_IMAGE:-moodify-karaoke-scoring:local}
    pull_policy: ${KARAOKE_SCORING_PULL_POLICY:-build}
    build:
      context: ../python-audio-separator
      dockerfile: Dockerfile.karaoke
      target: scoring-api
    restart: unless-stopped
    environment:
      AI_API_KEY: ${KARAOKE_SCORING_KEY:-local-karaoke-dev-key-change-before-deployment}
      AI_ENV: ${KARAOKE_SCORING_ENV:-dev}
      AI_CPU_THREADS: ${KARAOKE_SCORING_CPU_THREADS:-1}
      AI_DEVICE: cpu
    deploy:
      resources:
        limits:
          cpus: ${KARAOKE_SCORING_CPUS:-1.0}

  karaoke-media:
    build:
      context: ./supporting-services/karaoke-media
      dockerfile: Dockerfile
    profiles: ["karaoke"]
    restart: unless-stopped
    environment:
      PORT: "3001"
      KARAOKE_MEDIA_TICKET_SECRET: ${KARAOKE_MEDIA_TICKET_SECRET:-local-only-ticket-secret-change-before-deployment}
      KARAOKE_MEDIA_SERVICE_SECRET: ${KARAOKE_MEDIA_SERVICE_SECRET:-local-only-media-secret-change-before-deployment}
      KARAOKE_BACKEND_INTERNAL_URL: http://backend:8080
      MEDIASOUP_ALLOWED_ORIGINS: ${MEDIASOUP_ALLOWED_ORIGINS:-http://localhost:3000}
      MEDIASOUP_AUTH_TIMEOUT_MS: ${MEDIASOUP_AUTH_TIMEOUT_MS:-5000}
      KARAOKE_MEDIA_TICKET_CLOCK_TOLERANCE_SECONDS: ${KARAOKE_MEDIA_TICKET_CLOCK_TOLERANCE_SECONDS:-120}
      MEDIASOUP_LISTEN_IP: 0.0.0.0
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP:-127.0.0.1}
      MEDIASOUP_MIN_PORT: ${MEDIASOUP_MIN_PORT:-40000}
      MEDIASOUP_MAX_PORT: ${MEDIASOUP_MAX_PORT:-49999}
      WEBRTC_ICE_SERVERS: ${WEBRTC_ICE_SERVERS:-}
      TURN_SERVER_URLS: "${TURN_SERVER_URLS:-[]}"
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-}
      TURN_CREDENTIAL_TTL_SECONDS: "600"
    ports:
      - "127.0.0.1:3001:3001/tcp"
      - "127.0.0.1:${MEDIASOUP_MIN_PORT:-40000}-${MEDIASOUP_MAX_PORT:-49999}:${MEDIASOUP_MIN_PORT:-40000}-${MEDIASOUP_MAX_PORT:-49999}/udp"
      - "127.0.0.1:${MEDIASOUP_MIN_PORT:-40000}-${MEDIASOUP_MAX_PORT:-49999}:${MEDIASOUP_MIN_PORT:-40000}-${MEDIASOUP_MAX_PORT:-49999}/tcp"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
    depends_on:
      backend:
        condition: service_started

  coturn:
    image: coturn/coturn:4.6
    profiles: ["turn"]
    restart: unless-stopped
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --realm=${TURN_REALM:-localhost}
      - --lt-cred-mech
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:-local-only-turn-secret-change-before-deployment}
      - --external-ip=${MEDIASOUP_ANNOUNCED_IP:-127.0.0.1}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-tls
      - --no-dtls
    ports:
      - "127.0.0.1:3478:3478/udp"
      - "127.0.0.1:3478:3478/tcp"
      - "127.0.0.1:49160-49200:49160-49200/udp"

volumes:
  mysql-data:
  mongodb-data:
