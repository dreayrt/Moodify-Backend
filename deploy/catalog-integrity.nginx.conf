# Include these locations in the existing HTTPS server. Replace its old /data/audio/ location.
    location ^~ /data/audio/ {
        alias /opt/music-data-collector/data/audio/;
        auth_request /_catalog_audio_access;
        add_header Access-Control-Allow-Origin '*' always;
        add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
        add_header Access-Control-Allow-Headers '*' always;
        add_header Cache-Control 'no-store' always;
        expires off;
    }
    # CATALOG_INTEGRITY_GATE_V1_BEGIN
    location = /_catalog_audio_access {
        internal;
        proxy_pass http://127.0.0.1:8080/api/catalog/media-authorize;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_pass_request_headers off;
        proxy_set_header Content-Length '';
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }
    location ^~ /uploads/audio/ {
        alias /opt/moodify/uploads/audio/;
        auth_request /_catalog_audio_access;
        add_header Access-Control-Allow-Origin '*' always;
        add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
        add_header Access-Control-Allow-Headers '*' always;
        add_header Cache-Control 'no-store' always;
        expires off;
    }
    location ^~ /uploads/licenses/ {
        alias /opt/moodify/uploads/licenses/;
        auth_request /_catalog_audio_access;
        add_header Cache-Control 'no-store' always;
        expires off;
    }
    location = /api/content-lead/me/tracks {
        client_max_body_size 130m;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
    # CATALOG_INTEGRITY_GATE_V1_END
