name: moodify-recommendation-fixture
services:
  mysql:
    image: mysql:8.0.44
    command: ["--server-id=773313", "--event-scheduler=OFF"]
    environment:
      MYSQL_ROOT_PASSWORD: isolated-bootstrap-only
    ports: ["127.0.0.1:13316:3306"]
    volumes: ["./fixture-init.sql:/docker-entrypoint-initdb.d/fixture-init.sql:ro"]
    healthcheck:
      # TCP, not the socket: the image's init phase runs a socket-only temporary server that would report healthy before the real one is up.
      test: ["CMD", "mysqladmin", "ping", "--protocol=tcp", "-h", "127.0.0.1", "-uroot", "-pisolated-bootstrap-only", "--silent"]
      interval: 5s
      retries: 20
  mongo:
    image: mongo:7.0.26
    ports: ["127.0.0.1:13318:27017"]
