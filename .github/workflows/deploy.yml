name: Deploy Backend to Oracle VPS

on:
  push:
    branches:
      - main
      - Hai_Branch
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle Cloud VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Deploying Backend on branch: ${{ github.ref_name }}"
            cd /opt/moodify/backend
            git fetch origin
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            cd /opt/moodify
            docker compose build moodify-backend
            docker compose up -d moodify-backend
            echo "✅ Backend deployment completed successfully!"
