name: Recommendation regression in isolated databases
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'supporting-services/recommendation-worker/**'
      - 'pom.xml'
      - '.github/workflows/recommendations.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RECOMMENDATION_SMOKE_ENV: supporting-services/recommendation-worker/.env.smoke.example
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.12'
      - name: Install locked worker dependencies
        run: python -m pip install -r supporting-services/recommendation-worker/requirements.lock pytest==9.1.1
      - name: Backend unit and HTTP contract regression
        run: chmod +x mvnw && ./mvnw -B clean verify
      - name: Worker and smoke safety regression
        run: python -m pytest supporting-services/recommendation-worker -q
      - name: Provision dedicated fixture servers
        run: docker compose -f supporting-services/recommendation-worker/compose.test.yaml up -d --wait --wait-timeout 120
      - name: Install ffprobe and pdftotext required by startup checks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg poppler-utils
      - name: Exercise packaged backend against fixture-only credentials
        run: python supporting-services/recommendation-worker/integration_smoke.py
      - name: Remove only this job's fixture containers
        if: always()
        run: docker compose -f supporting-services/recommendation-worker/compose.test.yaml down --volumes
