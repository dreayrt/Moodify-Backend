spring.config.import=optional:file:.env[.properties]
# ===============================
# APPLICATION
# ===============================
spring.application.name=moodify

# Disable Spring Boot Docker Compose integration for local development
spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:false}

# ===============================
# SERVER
# ===============================
server.port=${SERVER_PORT}

# ===============================
# MYSQL DATABASE
# ===============================
spring.datasource.url=${DATABASE_SOURCE_URL}

spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ===============================
# MONGODB DATABASE
# ===============================
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:music_streaming}
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:music_streaming}

# ===============================
# JPA / HIBERNATE
# ===============================

# T? ??ng ??ng b? Entity v?i database
spring.jpa.hibernate.ddl-auto=update

# Hi?n th? SQL trong console khi ch?y
spring.jpa.show-sql=true

# Format SQL cho d? ??c
spring.jpa.properties.hibernate.format_sql=true

# MySQL Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ===============================
# TIMEZONE & ENCODING
# ===============================
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ===============================
# JWT
# ===============================
security.jwt.secret=${JWT_SECRET}
security.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:1200000}
security.jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# ===============================
# GOOGLE OAUTH
# ===============================
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}

# ===============================
# FACEBOOK OAUTH
# ===============================
facebook.app-id=${FACEBOOK_APP_ID:}
facebook.app-secret=${FACEBOOK_APP_SECRET:}

# ===============================
# CORS
# ===============================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

# ===============================
# APP SERVER (BACKEND)
# ===============================
app.backend-base-url=${APP_BACKEND_BASE_URL:}

# ===============================
# MULTIPART UPLOAD
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ===============================
# ORACLE AUDIO SERVER
# ===============================
oracle.audio.base-url=${ORACLE_AUDIO_BASE_URL:}

# ===============================
# ORACLE SYNC SCHEDULER
# ===============================
sync.scheduler.enabled=${SYNC_SCHEDULER_ENABLED:true}
sync.scheduler.fixed-rate-ms=${SYNC_SCHEDULER_FIXED_RATE_MS:900000}

# ===============================
# EMOTION DETECTION SERVICE
# ===============================
emotion.service.base-url=${EMOTION_SERVICE_BASE_URL}
mood.recommendations.max-distance=${MOOD_RECOMMENDATION_MAX_DISTANCE:0.35}

# ===============================
# OCR SERVICE
# ===============================
ocr.service.base-url=${OCR_SERVICE_BASE_URL}

# ===============================
# ERROR HANDLING
# ===============================
server.error.include-message=always
server.error.include-binding-errors=always

# ===============================
# SEPAY PAYMENT (VietQR)
# ===============================
sepay.secret-key=${SEPAY_SECRET_KEY:}
sepay.bank-account=${SEPAY_BANK_ACCOUNT:}
sepay.bank-name=${SEPAY_BANK_NAME:MBBank}
sepay.account-name=${SEPAY_ACCOUNT_NAME:}

# ===============================
# AUDIO ANALYSIS SERVICE (ESSENTIA)
# ===============================
audio.analysis.base-url=${AUDIO_ANALYSIS_SERVICE_BASE_URL:http://localhost:8002}

# Behavior-based recommendations (independent of emotion search).
# Reuses existing SQL sources; new recommendation persistence is limited to two Mongo collections.
recommendations.require-active-license=${RECOMMENDATIONS_REQUIRE_ACTIVE_LICENSE:true}
recommendations.mix-refresh-ms=${RECOMMENDATIONS_MIX_REFRESH_MS:900000}
recommendations.legacy-offset-minutes=${RECOMMENDATIONS_LEGACY_OFFSET_MINUTES:-420}
recommendations.enabled=${RECOMMENDATIONS_ENABLED:true}
recommendations.collaborative-enabled=${RECOMMENDATIONS_COLLABORATIVE_ENABLED:true}
recommendations.campaigns-enabled=${RECOMMENDATIONS_CAMPAIGNS_ENABLED:true}
recommendations.outcome-queue-capacity=${RECOMMENDATIONS_OUTCOME_QUEUE_CAPACITY:128}
recommendations.event-timeout-ms=${RECOMMENDATIONS_EVENT_TIMEOUT_MS:2000}
recommendations.outcome-failure-threshold=${RECOMMENDATIONS_OUTCOME_FAILURE_THRESHOLD:3}
recommendations.outcome-cooldown-ms=${RECOMMENDATIONS_OUTCOME_COOLDOWN_MS:30000}
