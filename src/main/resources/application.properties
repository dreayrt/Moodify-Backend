spring.config.import=optional:file:.env[.properties]
# ===============================
# APPLICATION
# ===============================
spring.application.name=moodify

# Disable Spring Boot Docker Compose integration for local development
spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:false}

# ===============================
# SERVER
# ===============================
server.port=${SERVER_PORT}

# ===============================
# MYSQL DATABASE
# ===============================
spring.datasource.url=${DATABASE_SOURCE_URL}

spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ===============================
# MONGODB DATABASE
# ===============================
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:music_streaming}
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:music_streaming}

# ===============================
# JPA / HIBERNATE
# ===============================

# T? ??ng ??ng b? Entity v?i database
spring.jpa.hibernate.ddl-auto=none

# Hi?n th? SQL trong console khi ch?y
spring.jpa.show-sql=true

# Format SQL cho d? ??c
spring.jpa.properties.hibernate.format_sql=true

# MySQL Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ===============================
# ENCODING
# ===============================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ===============================
# JWT
# ===============================
security.jwt.secret=${JWT_SECRET}
security.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:1200000}
security.jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# ===============================
# CORS
# ===============================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
