spring.config.import=optional:file:.env[.properties]
# ===============================
# APPLICATION
# ===============================
spring.application.name=moodify

# Disable Spring Boot Docker Compose integration for local development
spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:false}

# ===============================
# SERVER
# ===============================
server.port=${SERVER_PORT}

# ===============================
# MYSQL DATABASE
# ===============================
spring.datasource.url=${DATABASE_SOURCE_URL}

spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ===============================
# MONGODB DATABASE
# ===============================
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:music_streaming}
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:music_streaming}

# ===============================
# JPA / HIBERNATE
# ===============================

# T? ??ng ??ng b? Entity v?i database
spring.jpa.hibernate.ddl-auto=update

# Hi?n th? SQL trong console khi ch?y
spring.jpa.show-sql=true

# Format SQL cho d? ??c
spring.jpa.properties.hibernate.format_sql=true

# MySQL Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ===============================
# ENCODING
# ===============================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ===============================
# JWT
# ===============================
security.jwt.secret=${JWT_SECRET}
security.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:1200000}
security.jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# ===============================
# CORS
# ===============================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

# ===============================
# APP SERVER (BACKEND)
# ===============================
app.backend-base-url=${APP_BACKEND_BASE_URL:}

# ===============================
# MULTIPART UPLOAD
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ===============================
# ORACLE AUDIO SERVER
# ===============================
oracle.audio.base-url=${ORACLE_AUDIO_BASE_URL:}

# ===============================
# ORACLE SYNC SCHEDULER
# ===============================
sync.scheduler.enabled=${SYNC_SCHEDULER_ENABLED:true}
sync.scheduler.fixed-rate-ms=${SYNC_SCHEDULER_FIXED_RATE_MS:900000}

# ===============================
# EMOTION DETECTION SERVICE
# ===============================
emotion.service.base-url=${EMOTION_SERVICE_BASE_URL:http://localhost:8000}

# ===============================
# OCR SERVICE
# ===============================
ocr.service.base-url=${OCR_SERVICE_BASE_URL:http://localhost:8001}

